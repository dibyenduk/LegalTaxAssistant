# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: legal-tax-assistant
metadata:
    template: legal-tax-assistant@0.0.1
services:
    mcp-server:
        project: .
        host: containerapp
        resourceName: ${AZURE_CONTAINER_APP_NAME}
        language: python
        docker:
            path: ./Dockerfile
            context: .
            remoteBuild: true
    orchestrator:
        project: ./src/orchestrator
        host: azure.ai.agent
        language: docker
        kind: hosted
        name: LegalTaxOrchestrator-3
        protocols:
            - protocol: responses
              version: 2.0.0
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: CLASSIFIER_AGENT_NAME
              value: ClassifierAgent-2
            - name: REQUESTOR_AGENT_NAME
              value: RequestorAgent-2
            - name: LEGAL_AGENT_NAME
              value: LegalAgent-2
            - name: TAX_AGENT_NAME
              value: TaxAgent-2
            - name: DKWORKIQ_TOOLBOX_NAME
              value: DkWorkIQMail
        docker:
            path: ./Dockerfile
            context: .
            remoteBuild: true
infra:
    provider: bicep
    path: ./infra
